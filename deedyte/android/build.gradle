buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath("com.google.gms:google-services:4.3.15")
    }
}

apply plugin: "com.facebook.react.rootproject"
allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            url "https://repo.maven.apache.org/maven2"
        }
        maven {
            url "https://oss.sonatype.org/content/repositories/snapshots"
        }
    }
}
apply plugin: "expo-root-project"

// expo-updates CMake otherwise picks a default NDK (e.g. 27.0.12077973).
def pinNdk = { proj ->
    def androidExt = proj.extensions.findByName("android")
    if (androidExt != null && rootProject.ext.has("ndkVersion")) {
        androidExt.ndkVersion = rootProject.ext.ndkVersion
    }
}
subprojects { proj ->
    // Windows cannot reliably delete classes.jar under node_modules/*/android/build
    // while a daemon still has it open. Keep Expo/RN library outputs in android/build/nm/.
    def inNodeModules = proj.projectDir.absolutePath.replace('\\', '/').contains('/node_modules/')
    if (inNodeModules) {
        proj.layout.buildDirectory.set(rootProject.layout.buildDirectory.dir("nm/${proj.name}"))
    }
    proj.pluginManager.withPlugin("com.android.library") { pinNdk(proj) }
    proj.pluginManager.withPlugin("com.android.application") { pinNdk(proj) }
}
